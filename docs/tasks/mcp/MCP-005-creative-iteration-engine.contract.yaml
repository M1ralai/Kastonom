task:
  task_id: MCP-005
  title: "Metric-Informed Creative Iteration Engine"
  name: "Metric-Informed Creative Iteration Engine"
  goal: "Generate deterministic CreativeIterationSuggestion outputs from AdMetricsSnapshot data so the system can propose a new GenerationRequest when published ads underperform or show actionable decline signals."
  description: "Yayınlanmış reklamların AdMetricsSnapshot verilerini okuyarak deterministik kurallarla yeni GenerationRequest oluşturmak için CreativeIterationSuggestion üreten motorun inşası."
  layer: "mcp_ai"
  status: "planned"
  owner: "codex"
  allowed_files:
    - "mcp/src/iteration-engine/**"
    - "mcp/src/shared/**"
    - "mcp/tests/iteration-engine/**"
    - "docs/tasks/mcp/**"
    - "docs/contracts/**"
    - "docs/layers/**"
  forbidden_files:
    - "frontend/**"
    - "backend/src/api/**"
    - "backend/src/providers/**"
    - "mcp/src/ai/**"
  dependencies:
    - "MCP-001"
    - "MCP-003"
  scope:
    include:
      - "Read AdMetricsSnapshot records and identify deterministic metric drivers from stored values such as ctr, cost_per_video_view, video_view_rate, cpc, roas, conversions, conversion_value, impressions, clicks, and spend."
      - "Detect decline, stagnation, or efficiency loss patterns using a fixed rule set and produce a CreativeIterationSuggestion reason that explains why an iteration is needed."
      - "Generate suggested_changes for the next GenerationRequest using only evidence present in the metrics snapshot and related project context."
      - "Map weak-performing hooks, calls to action, pacing, or creative angles into structured change suggestions without inventing missing facts."
      - "Populate metric_drivers with the exact stored signals that triggered the suggestion."
      - "Populate fallback_notes when metrics are missing, null, stale, or insufficient to support a recommendation."
      - "Keep the output deterministic for identical snapshot and project inputs."
    exclude:
      - "Inventing missing metric values or estimating platform performance that is not stored."
      - "Direct connections to Meta Ads, Google Ads, or any external ad platform API."
      - "Database writes outside the returned contract object."
      - "LLM-generated reasoning or narrative copywriting."
  requirements:
    - id: "REQ-MCP005-001"
      description: "The engine must read only persisted AdMetricsSnapshot data and related project context; it must not query ad platform APIs directly."
      source_contract: "docs/contracts/data-model.contract.yaml"
      priority: "must"
    - id: "REQ-MCP005-002"
      description: "The engine must generate a CreativeIterationSuggestion with reason, metric_drivers, suggested_changes, confidence, and fallback_notes consistent with the data model."
      source_contract: "docs/contracts/data-model.contract.yaml"
      priority: "must"
    - id: "REQ-MCP005-003"
      description: "CTR, cost_per_video_view, video_view_rate, cpc, roas, conversions, and conversion_value must be interpreted with deterministic rule-based thresholds."
      source_contract: "docs/layers/mcp-layer.contract.md"
      priority: "must"
    - id: "REQ-MCP005-004"
      description: "Missing or null metric values must never be fabricated; the engine must return fallback_notes that explain insufficient data."
      source_contract: "docs/contracts/data-model.contract.yaml"
      priority: "must"
    - id: "REQ-MCP005-005"
      description: "The output must remain JSON-compatible and deterministic for the same input snapshot and project state."
      source_contract: "docs/contracts/ai-behavior.contract.yaml"
      priority: "must"
  acceptance_criteria:
    - id: "AC-MCP005-001"
      description: "Given a snapshot with declining CTR, rising cost_per_video_view, or falling video_view_rate, the engine produces a clear rule-based reason and a matching suggested_changes payload."
      verification: "automated"
    - id: "AC-MCP005-002"
      description: "When metrics are missing or null, the engine never invents values and returns fallback_notes containing an insufficient-data reason."
      verification: "automated"
    - id: "AC-MCP005-003"
      description: "The same AdMetricsSnapshot input always yields the same CreativeIterationSuggestion output byte-for-byte."
      verification: "automated"
    - id: "AC-MCP005-004"
      description: "metric_drivers lists only stored signals that actually influenced the suggestion."
      verification: "review"
    - id: "AC-MCP005-005"
      description: "suggested_changes references only allowed creative adjustments such as hook, CTA, pacing, or angle changes and does not fabricate platform results."
      verification: "review"
    - id: "AC-MCP005-006"
      description: "Fallback handling returns a structured suggestion with confidence lowered and a human-readable insufficient-data note."
      verification: "automated"
  failure_behavior:
    missing_input: "If AdMetricsSnapshot or required project context is missing, return a structured fallback suggestion and do not infer performance values."
    missing_config: "Use documented metric thresholds only; do not invent heuristic thresholds at runtime."
    external_dependency_failure: "Do not call external ad APIs; if snapshot data is stale or incomplete, fallback_notes must explain the limitation."
    partial_completion: "Return the suggestion fields that can be derived from stored data and explicitly mark unsupported fields in fallback_notes."
  test_commands:
    - command: "npm test -- mcp/iteration-engine --testNamePattern='rule-based' --coverage"
      expected_result: "Rule-based iteration tests pass and confirm deterministic reason and suggested_changes generation."
    - command: "npm test -- mcp/iteration-engine --testNamePattern='missing metrics' --verbose"
      expected_result: "Missing-metric tests confirm no fabricated values and fallback_notes include insufficient-data reasons."
  expected_output:
    changed_files:
      - "mcp/src/iteration-engine/creative-iteration-engine.ts"
      - "mcp/src/iteration-engine/iteration-rules.ts"
      - "mcp/tests/iteration-engine/creative-iteration-engine.test.ts"
      - "mcp/tests/fixtures/ad-metrics-fixtures.ts"
    user_visible_behavior:
      - "Backend can request a deterministic creative iteration suggestion from stored ad metrics."
      - "Underperforming ad metrics produce an explainable reason and a structured set of suggested creative changes."
      - "Missing or null metrics produce a safe fallback with explicit insufficient-data notes."
    machine_readable_artifacts:
      - "CreativeIterationSuggestion JSON compatible output."
      - "Metric driver classification rules for CTR, cost_per_video_view, video_view_rate, cpc, roas, conversions, and conversion_value."
  reporting_format:
    required_sections:
      - "changed_files"
      - "tests_run"
      - "assumptions"
      - "risks"
      - "next_safe_step"
    notes: "Keep the implementation deterministic and reference only stored metrics."
