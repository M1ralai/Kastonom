task:
  task_id: MCP-007
  title: "Direct Provider API Execution from MCP"
  name: "Direct Provider API Execution from MCP"
  goal: "Send the MCP-004 PromptPayload directly to live video provider HTTP APIs from the MCP layer, parse the provider response, and hand back a normalized result for backend persistence."
  description: "MCP-004'te üretilen PromptPayload paketini alarak doğrudan video sağlayıcılarının (Kling, Runway, Pollo) gerçek API'lerine HTTP isteği (fetch/axios) atan network katmanının oluşturulması."
  layer: "mcp_ai"
  status: "planned"
  owner: "codex"
  allowed_files:
    - "mcp/src/network/**"
    - "mcp/src/adapters/**"
    - "mcp/src/prompt-compiler/**"
    - "mcp/tests/network/**"
    - "docs/tasks/mcp/**"
    - "docs/contracts/**"
    - "docs/layers/**"
  forbidden_files:
    - "frontend/**"
    - "backend/src/api/**"
    - "backend/src/db/**"
    - "backend/src/repositories/**"
  dependencies:
    - "MCP-004"
  scope:
    include:
      - "Send HTTP POST requests from MCP to live provider REST APIs using fetch or axios."
      - "Read provider API keys from secure configuration and attach them to outbound request headers."
      - "Support Kling, Runway, and Pollo provider endpoints through a deterministic network execution layer."
      - "Parse provider responses into a normalized ProviderResult payload, including Provider_Job_ID or Video_URL when returned by the provider."
      - "Fail closed when live mode is requested but API credentials are missing."
      - "Return a clean machine-readable response that backend can persist without knowing provider-specific response shapes."
      - "Keep database writes out of scope so persistence remains a backend responsibility."
    exclude:
      - "Database persistence of provider responses or generated video records."
      - "Backend repository or ORM integration."
      - "Frontend rendering or UI transport concerns."
      - "Inventing provider responses or masking live API failures as success."
  requirements:
    - id: "REQ-MCP007-001"
      description: "The MCP network layer must be able to execute real HTTP POST requests to the target provider API endpoint using a deterministic request format."
      source_contract: "docs/layers/mcp-layer.contract.md"
      priority: "must"
    - id: "REQ-MCP007-002"
      description: "API keys must be read securely and placed in request headers only; credentials must not be exposed in output payloads or logs."
      source_contract: "docs/contracts/ai-behavior.contract.yaml"
      priority: "must"
    - id: "REQ-MCP007-003"
      description: "The network layer must parse provider-specific success responses into a normalized ProviderResult shape with Provider_Job_ID or Video_URL when available."
      source_contract: "docs/contracts/data-model.contract.yaml"
      priority: "must"
    - id: "REQ-MCP007-004"
      description: "If live mode is requested and the API key is missing, the task must fail closed and then fall back to mock only when the fallback policy explicitly allows it."
      source_contract: "docs/layers/mcp-layer.contract.md"
      priority: "must"
    - id: "REQ-MCP007-005"
      description: "Database persistence must remain outside this task so backend can store ProviderResult and generated video state separately."
      source_contract: "docs/contracts/data-model.contract.yaml"
      priority: "must"
  acceptance_criteria:
    - id: "AC-MCP007-001"
      description: "MCP successfully sends a prepared PromptPayload to the selected live provider REST API and receives a provider response without backend mediation."
      verification: "automated"
    - id: "AC-MCP007-002"
      description: "Missing API key in live mode causes a structured error and triggers mock fallback only when fallback policy allows it."
      verification: "automated"
    - id: "AC-MCP007-003"
      description: "Provider response data is normalized into a clean ProviderResult or equivalent machine-readable artifact before it is handed to backend."
      verification: "automated"
    - id: "AC-MCP007-004"
      description: "Kling, Runway, and Pollo request paths remain provider-specific in transport but share the same normalized output contract."
      verification: "review"
    - id: "AC-MCP007-005"
      description: "No database writes, repository calls, or ORM operations occur inside the MCP network execution layer."
      verification: "review"
    - id: "AC-MCP007-006"
      description: "Outbound request headers include the required authentication material and do not leak secrets into logs or returned objects."
      verification: "automated"
  failure_behavior:
    missing_input: "Return INVALID_REQUEST if PromptPayload or provider target is missing."
    missing_config: "Fail closed with PROVIDER_CONFIG_MISSING when live credentials are absent; mock fallback is allowed only when policy enables it."
    external_dependency_failure: "Return a structured provider error or fallback to mock if fallback policy permits; never invent a success response."
    partial_completion: "Report which provider execution path succeeded, which failed, and whether a normalized result could be produced."
  technical_notes: "BE-009 görevindeki HTTP istek sorumluluğu tamamen bu task ile MCP katmanına devredilmiştir. Bu kodlar dışarıya gerçek ağ istekleri atacaktır."
  test_commands:
    - command: "npm test -- mcp/network --testNamePattern='live provider request' --verbose"
      expected_result: "Live request tests confirm fetch or axios sends PromptPayload to provider endpoints and parses normalized responses."
    - command: "npm test -- mcp/network --testNamePattern='missing api key' --verbose"
      expected_result: "Missing credential tests confirm fail-closed behavior and allowed mock fallback."
    - command: "npm test -- mcp/network --coverage"
      expected_result: "Network execution coverage includes success, failure, and normalization paths."
  expected_output:
    changed_files:
      - "mcp/src/network/provider-network-executor.ts"
      - "mcp/src/network/provider-response-normalizer.ts"
      - "mcp/src/network/provider-auth.ts"
      - "mcp/tests/network/provider-network-executor.test.ts"
    user_visible_behavior:
      - "MCP can directly submit prompt payloads to live Kling, Runway, and Pollo APIs."
      - "Live mode without credentials fails closed and only falls back when policy allows it."
      - "Backend receives normalized provider results instead of raw provider-specific payloads."
    machine_readable_artifacts:
      - "Normalized ProviderResult payloads."
      - "Parsed Provider_Job_ID and Video_URL fields."
      - "Provider-specific HTTP execution logs without secrets."
  reporting_format:
    required_sections:
      - "changed_files"
      - "tests_run"
      - "assumptions"
      - "risks"
      - "next_safe_step"
    notes: "State clearly when live provider calls are enabled and keep backend persistence out of scope."
