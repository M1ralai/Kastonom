task:
  name: "MCP-003 Structured Creative Brief Generation"
  goal: "Transform scoring output, product details, and audience data into a deterministic structured JSON creative brief ready for prompt compilation, with strict guardrails preventing fabricated claims."
  layer: "mcp_ai"
  status: "planned"
  owner: "codex"
  allowed_files:
    - "mcp/src/brief-generator/**"
    - "mcp/tests/brief-generator/**"
    - "docs/tasks/mcp/**"
    - "docs/prompts/**"
  forbidden_files:
    - "frontend/**"
    - "backend/src/providers/**"
    - "backend/src/api/**"
  dependencies:
    - "MCP-001"
    - "MCP-002"
  scope:
    include:
      - "Create BriefGenerator interface accepting AIBehaviorOutput and ProductMetrics."
      - "Implement generateCreativeBrief() deterministic function returning JSON matching docs/prompts/creative-brief.template.yaml schema."
      - "Map product fields (id, name, category, is_new, price, stock_quantity, source) from input without modification or invention."
      - "Extract audience segment, age_range, buying_motivation from input; mark source (mock|erp|commerce|analytics|unknown)."
      - "Pass through score fields (hype_score, trend_potential_score, sales_velocity, stock_movement, new_product_boost, audience_fit) with confidence level."
      - "Generate creative_angle and tone based on hype_score and audience_fit combinations (rule-based, deterministic)."
      - "Preserve forbidden_claims array; add new constraints detected from product data (e.g., if price=null, add 'Do not claim price' to forbidden_claims)."
      - "Generate hook, main_claim, and call_to_action based on creative_angle and product category (template-based mapping)."
      - "Validate all text outputs do not contain invented product features, price claims, discounts, guarantees, or shipping promises."
      - "Populate fallback_notes with all data gaps and guardrail triggers (e.g., 'price_unavailable', 'stock_not_provided', 'claim_removed_no_evidence')."
      - "Set confidence field: 'high' if all product/audience data present, 'medium' if partial, 'low' if >50% data missing."
      - "Add deterministic unit tests with fixture AIBehaviorOutput inputs proving same input = same CreativeBrief."
      - "Add claim-validation tests verifying no invented prices, discounts, unavailable features."
    exclude:
      - "LLM-based narrative or copywriting (defer to later integration tasks)."
      - "Live API calls or ERP integration."
      - "Database persistence."
      - "User interface rendering."
      - "Video style or platform-specific rendering (handled downstream)."

requirements:
  - id: "REQ-MCP003-001"
    description: "CreativeBrief output must parse as valid JSON and exactly match schema in docs/prompts/creative-brief.template.yaml."
    source_contract: "docs/prompts/creative-brief.template.yaml"
    priority: "must"
  - id: "REQ-MCP003-002"
    description: "forbidden_claims array must be preserved from input and augmented with detected guardrail violations; never removed or truncated."
    source_contract: "docs/contracts/ai-behavior.contract.yaml"
    priority: "must"
  - id: "REQ-MCP003-003"
    description: "All product factual fields (price, stock, features) must come from input data or marked unknown; zero invented claims."
    source_contract: "docs/contracts/ai-behavior.contract.yaml (forbidden_outputs)"
    priority: "must"
  - id: "REQ-MCP003-004"
    description: "BriefGenerator must be pure function: same AIBehaviorOutput input produces identical CreativeBrief output."
    source_contract: "docs/layers/mcp-layer.contract.md (Deterministic Rules)"
    priority: "must"
  - id: "REQ-MCP003-005"
    description: "Fallback notes must track: field_name, reason (e.g., 'price_unavailable', 'claim_removed_halucination_risk'), data_source."
    source_contract: "docs/contracts/ai-behavior.contract.yaml (fallback_behavior)"
    priority: "should"
  - id: "REQ-MCP003-006"
    description: "Creative angle and tone selection must follow documented rule-based mapping, not randomized or context-dependent."
    source_contract: "docs/layers/mcp-layer.contract.md"
    priority: "should"

acceptance_criteria:
  - id: "AC-MCP003-001"
    description: "CreativeBrief JSON output is valid and contains all required fields from template: product, audience, insight, campaign, message, constraints, fallback_notes."
    verification: "automated"
  - id: "AC-MCP003-002"
    description: "Product fields (name, category, price, stock_quantity) are passed through unchanged from input; none are synthesized or modified."
    verification: "review"
  - id: "AC-MCP003-003"
    description: "Audience fields (age_range, primary_segment, buying_motivation, source) are mapped from input data; unknown values explicitly marked 'unknown'."
    verification: "automated"
  - id: "AC-MCP003-004"
    description: "Insight object contains: hype_score, trend_potential_score, sales_velocity, stock_movement, new_product_boost, audience_fit, reason, confidence."
    verification: "review"
  - id: "AC-MCP003-005"
    description: "Creative_angle selected by rule-based mapping (e.g., high_hype + young_audience → 'trending_must_have'); determinism verified with identical fixture inputs."
    verification: "automated"
  - id: "AC-MCP003-006"
    description: "Forbidden_claims array preserved from input; new guardrail violations added (e.g., 'Do not claim price' if price=null)."
    verification: "automated"
  - id: "AC-MCP003-007"
    description: "Hook, main_claim, call_to_action generated from template mappings; zero invented product features or unsupported claims."
    verification: "review"
  - id: "AC-MCP003-008"
    description: "Confidence level set correctly: 'high' if all core fields populated, 'medium' if 30-70% missing, 'low' if >70% missing."
    verification: "automated"
  - id: "AC-MCP003-009"
    description: "Fallback_notes array populated with entry for each missing product/audience field or guardrail trigger; format: [{ field, reason, source }]."
    verification: "automated"
  - id: "AC-MCP003-010"
    description: "Determinism test: run BriefGenerator with 10 identical fixture AIBehaviorOutput inputs; confirm all outputs are byte-identical JSON."
    verification: "automated"
  - id: "AC-MCP003-011"
    description: "Claim validation test: verify no output contains invented prices, discounts, guarantees, shipping claims, or unavailable features."
    verification: "automated"

failure_behavior:
  missing_input: "If AIBehaviorOutput missing: return structured error with brief_id=null. If ProductMetrics missing: set affected fields to null, add fallback note, return partial brief."
  missing_config: "If creative angle mapping not configured: default to 'general' tone, document assumption in fallback_notes."
  external_dependency_failure: "Do not call external service to generate brief; use only rule-based mapping and provided input data."
  partial_completion: "Return CreativeBrief with confidence='low' and comprehensive fallback_notes; never skip brief generation."

test_commands:
  - command: "npm test -- mcp/brief-generator --testNamePattern='schema' --verbose"
    expected_result: "All CreativeBrief JSON schema validation tests pass; output contains all required fields."
  - command: "npm test -- mcp/brief-generator --testNamePattern='determinism' --verbose"
    expected_result: "Determinism test confirms identical fixture inputs produce identical JSON output."
  - command: "npm test -- mcp/brief-generator --testNamePattern='guardrails' --coverage"
    expected_result: "Guardrail and claim validation tests pass; zero invented claims in test output."

expected_output:
  changed_files:
    - "mcp/src/brief-generator/brief-generator.ts"
    - "mcp/src/brief-generator/creative-angle-mapper.ts"
    - "mcp/src/brief-generator/claim-validator.ts"
    - "mcp/tests/brief-generator/brief-generator.test.ts"
    - "mcp/tests/fixtures/ai-behavior-output-fixtures.ts"
  user_visible_behavior:
    - "Backend can call BriefGenerator with MCP scoring output and receive JSON CreativeBrief ready for prompt compilation."
    - "Creative angle, tone, and message are deterministic and traceable to input data."
    - "Fallback notes clearly document missing data and guardrail decisions."
  machine_readable_artifacts:
    - "brief-generator.ts exports: generateCreativeBrief(input: AIBehaviorOutput): CreativeBrief."
    - "creative-angle-mapper.ts exports mapping rules (score ranges → angles)."
    - "claim-validator.ts exports validation checks (no_price_claims, no_guarantees, etc)."

reporting_format:
  required_sections:
    - "changed_files"
    - "tests_run"
    - "creative_angle_mapping_rules"
    - "determinism_verification_results"
    - "claim_validation_coverage"
    - "assumptions"
    - "fallback_notes_statistics"
    - "next_safe_step"
  notes: "Include example CreativeBrief JSON output for demo and live tenant modes. Document creative-angle mapper rules with examples. Highlight any field conflicts between input AIBehaviorOutput and CreativeBrief template that required resolution."
