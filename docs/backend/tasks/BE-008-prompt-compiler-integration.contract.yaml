task:
  name: "BE-008 Prompt Compiler Backend Integration"
  goal: "Connect validated creative briefs to the prompt compiler and store normalized prompt payloads."
  layer: "backend"
  status: "planned"
  owner: "codex"
  allowed_files:
    - "backend/src/prompt-compiler/**"
    - "backend/src/campaigns/**"
    - "backend/src/domain/**"
    - "backend/src/repositories/**"
    - "backend/tests/**"
    - "docs/backend/**"
  forbidden_files:
    - "frontend/**"
    - "backend/src/providers/adapters/pollo*"
    - "backend/src/providers/adapters/kling*"
    - "backend/src/providers/adapters/runway*"
  dependencies:
    - "BE-007"
  scope:
    include:
      - "Create prompt compiler service or adapter to existing prompt compiler module."
      - "Accept provider and creative brief input."
      - "Return normalized prompt payload with prompt_text, negative_prompt, duration_seconds, aspect_ratio, language, metadata, is_mock, and fallback_notes."
      - "Preserve forbidden claims and negative instructions."
      - "Store prompt payload metadata with campaign or video job."
      - "Add tests for mock provider, unsupported provider, and forbidden claim preservation."
    exclude:
      - "Calling live video provider APIs."
      - "Frontend prompt display decisions."
      - "MCP scoring logic."

requirements:
  - id: "REQ-BE008-001"
    description: "Prompt compiler converts structured creative brief into provider-specific video generation prompt payloads."
    source_contract: "docs/prompts/prompt-compiler.contract.md"
    priority: "must"
  - id: "REQ-BE008-002"
    description: "Compiler output must preserve forbidden claims and negative instructions."
    source_contract: "docs/contracts/mvp.contract.yaml"
    priority: "must"

acceptance_criteria:
  - id: "AC-BE008-001"
    description: "Valid creative brief produces normalized prompt payload."
    verification: "automated"
  - id: "AC-BE008-002"
    description: "Forbidden claims and fallback notes are present in compiler output."
    verification: "automated"
  - id: "AC-BE008-003"
    description: "Unsupported provider fails clearly or uses mock fallback only when allowed."
    verification: "automated"
  - id: "AC-BE008-004"
    description: "Prompt compiler service does not perform provider network calls."
    verification: "review"

failure_behavior:
  missing_input: "Return validation error and do not create provider job."
  missing_config: "Unsupported provider uses fallback only when fallback mode allows it."
  external_dependency_failure: "Return prompt compiler error and leave campaign failed or recover via documented fallback."
  partial_completion: "Report supported providers and unsupported provider behavior."

test_commands:
  - command: "TBD backend test command for prompt compiler integration"
    expected_result: "Prompt compiler integration tests pass."

expected_output:
  changed_files:
    - "backend/src/prompt-compiler/**"
    - "backend/tests/**"
  user_visible_behavior:
    - "Campaign generation response includes backend-generated prompt payload."
  machine_readable_artifacts:
    - "PromptPayload schema or validator."

reporting_format:
  required_sections:
    - "changed_files"
    - "tests_run"
    - "assumptions"
    - "risks"
    - "next_safe_step"
  notes: "Mention any provider-specific metadata added."

