task:
  name: "BE-007 MCP Client and AI Output Validation"
  goal: "Implement the backend boundary to MCP / AI intelligence and validate structured output for safety."
  layer: "backend"
  status: "planned"
  owner: "codex"
  allowed_files:
    - "backend/src/mcp/**"
    - "backend/src/campaigns/**"
    - "backend/src/domain/**"
    - "backend/tests/**"
    - "docs/backend/**"
  forbidden_files:
    - "frontend/**"
    - "backend/src/providers/adapters/pollo*"
    - "backend/src/providers/adapters/kling*"
    - "backend/src/providers/adapters/runway*"
  dependencies:
    - "BE-006"
  scope:
    include:
      - "Create MCP client interface that accepts structured product, metrics, audience, and preference input."
      - "Create deterministic mock intelligence for demo mode if real MCP service is not implemented."
      - "Validate CreativeIntelligenceOutput required fields."
      - "Reject product id mismatch."
      - "Reject or strip unsupported claims and preserve fallback notes."
      - "Add tests for missing metrics, invalid JSON shape, unsupported discounts, and deterministic output."
    exclude:
      - "Provider prompt formatting."
      - "Provider network calls."
      - "Frontend rendering logic."

requirements:
  - id: "REQ-BE007-001"
    description: "Backend must call MCP / AI layer for commerce decisions."
    source_contract: "docs/architecture.md"
    priority: "must"
  - id: "REQ-BE007-002"
    description: "MCP / AI layer must not invent missing facts or demographics."
    source_contract: "docs/contracts/ai-behavior.contract.yaml"
    priority: "must"

acceptance_criteria:
  - id: "AC-BE007-001"
    description: "MCP client sends structured data only."
    verification: "review"
  - id: "AC-BE007-002"
    description: "Invalid AI output returns AI_OUTPUT_INVALID and does not continue to prompt compilation."
    verification: "automated"
  - id: "AC-BE007-003"
    description: "Missing metrics produce unknown or fallback notes instead of invented data."
    verification: "automated"
  - id: "AC-BE007-004"
    description: "Same input produces same mock intelligence output."
    verification: "automated"

failure_behavior:
  missing_input: "Return structured validation failure or fallback notes without fabricating data."
  missing_config: "Use deterministic mock intelligence only when demo fallback mode allows it."
  external_dependency_failure: "Return AI_OUTPUT_INVALID or fallback reason according to fallback policy."
  partial_completion: "Report validator coverage and unsupported AI fields."

test_commands:
  - command: "TBD backend test command for MCP client and AI validation"
    expected_result: "AI validation tests pass."

expected_output:
  changed_files:
    - "backend/src/mcp/**"
    - "backend/tests/**"
  user_visible_behavior:
    - "Creative brief fields are structured and safe for prompt compilation."
  machine_readable_artifacts:
    - "CreativeIntelligenceOutput schema or validator."

reporting_format:
  required_sections:
    - "changed_files"
    - "tests_run"
    - "assumptions"
    - "risks"
    - "next_safe_step"
  notes: "List any supported fallback notes emitted by mock intelligence."

