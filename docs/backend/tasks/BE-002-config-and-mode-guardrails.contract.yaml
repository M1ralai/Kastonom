task:
  name: "BE-002 Configuration and Mode Guardrails"
  goal: "Implement explicit backend mode, fallback, video provider, ad platform, and credential readiness configuration."
  layer: "backend"
  status: "planned"
  owner: "codex"
  allowed_files:
    - "backend/src/config/**"
    - "backend/src/http/routes/health*"
    - "backend/src/domain/**"
    - "backend/tests/**"
    - "docs/backend/**"
  forbidden_files:
    - "frontend/**"
  dependencies:
    - "BE-001"
  scope:
    include:
      - "Parse KASTONOM_MODE with default mock."
      - "Parse KASTONOM_FALLBACK_ENABLED with safe default for local demo."
      - "Parse default video provider, platform, language, duration, and aspect ratio."
      - "Validate video provider credential readiness without exposing secrets."
      - "Validate ad platform readiness without storing or exposing secrets."
      - "Expose safe readiness flags through GET /health."
      - "Add tests for mock mode, live missing credentials, invalid mode, and no-secret health output."
    exclude:
      - "Actual live provider network calls."
      - "Actual ad platform publication calls."
      - "Frontend environment wiring."

requirements:
  - id: "REQ-BE002-001"
    description: "Backend must fail closed when required configuration is missing."
    source_contract: "docs/contracts/mvp.contract.yaml"
    priority: "must"
  - id: "REQ-BE002-002"
    description: "API keys and platform credentials must come from environment variables or secure connector storage and never be sent to frontend."
    source_contract: "docs/contracts/api.contract.yaml"
    priority: "must"

acceptance_criteria:
  - id: "AC-BE002-001"
    description: "Mock mode starts without live video provider or ad platform credentials."
    verification: "automated"
  - id: "AC-BE002-002"
    description: "Live provider readiness reports missing credentials without exposing values."
    verification: "automated"
  - id: "AC-BE002-003"
    description: "Invalid mode returns a startup or config validation error."
    verification: "automated"
  - id: "AC-BE002-004"
    description: "Health response contains only safe config summary."
    verification: "review"

failure_behavior:
  missing_input: "Use documented defaults from backend-system-plan."
  missing_config: "Fail closed in live video provider or ad platform mode and keep mock mode available."
  external_dependency_failure: "Not applicable unless config loader depends on a package."
  partial_completion: "Report which modes are implemented and which are pending."

test_commands:
  - command: "TBD backend test command for config"
    expected_result: "Config and health mode tests pass."

expected_output:
  changed_files:
    - "backend/src/config/**"
    - "backend/tests/**"
  user_visible_behavior:
    - "Backend mode is explicit and safe."
  machine_readable_artifacts:
    - "Typed config object or equivalent runtime config schema."

reporting_format:
  required_sections:
    - "changed_files"
    - "tests_run"
    - "assumptions"
    - "risks"
    - "next_safe_step"
  notes: "Mention any selected default values."
