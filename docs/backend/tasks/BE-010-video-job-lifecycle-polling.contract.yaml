task:
  name: "BE-010 Video Job Lifecycle and Polling"
  goal: "Implement video job persistence, status transitions, provider result storage, generated video exposure, and GET /video-jobs/{id}."
  layer: "backend"
  status: "planned"
  owner: "codex"
  allowed_files:
    - "backend/src/video-jobs/**"
    - "backend/src/generated-videos/**"
    - "backend/src/http/routes/video-jobs*"
    - "backend/src/http/routes/generated-videos*"
    - "backend/src/providers/**"
    - "backend/src/repositories/**"
    - "backend/tests/**"
    - "docs/backend/**"
  forbidden_files:
    - "frontend/**"
  dependencies:
    - "BE-009"
  scope:
    include:
      - "Create video job service."
      - "Persist VideoJob, ProviderResult, and GeneratedVideo records by tenant."
      - "Implement allowed status transitions: queued, submitted, processing, completed, failed, canceled."
      - "Implement GET /video-jobs/{id}."
      - "Implement POST /generated-videos/{id}/select."
      - "Return provider, status, error, is_mock, provider_result, and generated_videos."
      - "Add tests for successful polling, not found, cross-tenant access, failed job response, and generated video selection."
    exclude:
      - "Provider webhooks."
      - "Long-running background workers."
      - "Frontend polling implementation."
      - "Ad publication."

requirements:
  - id: "REQ-BE010-001"
    description: "VideoJob must track provider, status, prompt payload, timestamps, attempts, fallback reason, and normalized errors."
    source_contract: "docs/contracts/data-model.contract.yaml"
    priority: "must"
  - id: "REQ-BE010-002"
    description: "Frontend can poll job status by id."
    source_contract: "docs/contracts/api.contract.yaml"
    priority: "must"

acceptance_criteria:
  - id: "AC-BE010-001"
    description: "GET /video-jobs/{id} returns job state for the owning tenant."
    verification: "automated"
  - id: "AC-BE010-002"
    description: "Cross-tenant job lookup does not reveal the job."
    verification: "automated"
  - id: "AC-BE010-003"
    description: "Failed provider result is normalized into the video job error fields."
    verification: "automated"
  - id: "AC-BE010-004"
    description: "Mock completed job includes is_mock=true and generated video URL when available."
    verification: "automated"
  - id: "AC-BE010-005"
    description: "Selecting a generated video updates CreativeProject.selected_generated_video_id."
    verification: "automated"

failure_behavior:
  missing_input: "Return VIDEO_JOB_NOT_FOUND or GENERATED_VIDEO_NOT_FOUND for unknown ids without leaking tenant data."
  missing_config: "Not applicable unless job status depends on provider config."
  external_dependency_failure: "Use stored normalized provider result rather than live polling when provider is unavailable."
  partial_completion: "Report implemented transitions and pending worker/webhook behavior."

test_commands:
  - command: "TBD backend test command for video jobs"
    expected_result: "Video job tests pass."

expected_output:
  changed_files:
    - "backend/src/video-jobs/**"
    - "backend/src/generated-videos/**"
    - "backend/src/http/routes/video-jobs*"
    - "backend/src/http/routes/generated-videos*"
    - "backend/tests/**"
  user_visible_behavior:
    - "Frontend can poll video job status and select a generated video."
  machine_readable_artifacts:
    - "GET /video-jobs/{id} JSON response."
    - "POST /generated-videos/{id}/select JSON response."

reporting_format:
  required_sections:
    - "changed_files"
    - "tests_run"
    - "assumptions"
    - "risks"
    - "next_safe_step"
  notes: "State whether mock jobs complete immediately or progress across polls."
